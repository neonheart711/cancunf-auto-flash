name: Build Executables (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: cancunf-toolkit-windows.exe
            script_file: windows-adb-install.bat
          - os: ubuntu-latest
            artifact_name: cancunf-toolkit-linux
            script_file: linux-adb-install.sh
          - os: macos-latest
            artifact_name: cancunf-toolkit-macos
            script_file: mac-adb-install.sh

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller colorama

      - name: Build Standalone Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --clean --name "cancunf-toolkit-windows.exe" --hidden-import=gui_app --hidden-import=custom_rom_flash --hidden-import=colorama --hidden-import=tkinter --add-data "windows-adb-install.bat;." app.py

      - name: Build Standalone Executable (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --clean \
            --name "${{ matrix.artifact_name }}" \
            --hidden-import=gui_app \
            --hidden-import=custom_rom_flash \
            --hidden-import=colorama \
            --hidden-import=tkinter \
            --add-data "${{ matrix.script_file }}:." \
            app.py

      - name: Upload Compiled Software
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*
          
