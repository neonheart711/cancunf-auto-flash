name: Build Executables (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: cancunf-toolkit-windows.exe
            script_file: windows-adb-install.bat
            sep: ";"
          - os: ubuntu-latest
            artifact_name: cancunf-toolkit-linux
            script_file: linux-adb-install.sh
            sep: ":"
          - os: macos-latest
            artifact_name: cancunf-toolkit-macos
            script_file: mac-adb-install.sh
            sep: ":"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk binutils

      - name: Install PyInstaller & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller colorama

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onefile --clean \
            --name "${{ matrix.artifact_name }}" \
            --hidden-import=gui_app \
            --hidden-import=custom_rom_flash \
            --hidden-import=colorama \
            --hidden-import=tkinter \
            --add-data "${{ matrix.script_file }}${{ matrix.sep }}." \
            app.py

      - name: Upload Compiled Software
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*
